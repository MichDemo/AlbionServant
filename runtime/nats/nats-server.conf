server_name: albionservant-local

host: 127.0.0.1
port: 4222

jetstream {
    store_dir: "./data/jetstream"
    max_file_store: 2GB
}

authorization {
    users: [
        {
            user: "albionservant"
            password: "local-only-change-me"
            permissions: {
                publish: [
                    "marketorders.ingest"
                    "markethistories.ingest"
                    "goldprices.ingest"
                    "mapdata.ingest"
                    "banditevent.ingest"
                    "$JS.API.>"
                    "_INBOX.>"
                ]

                subscribe: [
                    "marketorders.ingest"
                    "markethistories.ingest"
                    "goldprices.ingest"
                    "mapdata.ingest"
                    "banditevent.ingest"
                    "$JS.API.>"
                    "_INBOX.>"
                ]
            }
        }
    ]
}

http: 127.0.0.1:8222

logtime: true