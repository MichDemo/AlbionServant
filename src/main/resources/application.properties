

# ===== BEGIN ALBIONSERVANT LOCAL MARKET INTEGRATION =====
albion.local.enabled=true
albion.local.strict-loopback=true
albion.local.server-name=EUROPE
albion.local.raw-retention-days=7

# Embedded SQLite. Leave path empty to use:
# Windows: %LOCALAPPDATA%/AlbionServant/data/albionservant.db
# Other OS: ~/.albionservant/data/albionservant.db
albion.local.sqlite.path=
albion.local.sqlite.busy-timeout-ms=10000
albion.local.sqlite.pool-size=2

albion.local.nats.url=nats://127.0.0.1:4222
albion.local.nats.user=albionservant
albion.local.nats.password=local-only-change-me
albion.local.nats.stream-name=AODP_RAW
albion.local.nats.max-bytes=1073741824
albion.local.nats.batch-size=100
albion.local.nats.ack-wait-seconds=60
albion.local.nats.max-deliver=10

# NATS and AODP remain optional managed local processes.
albion.local.processes.manage=true
albion.local.processes.start-nats=true
albion.local.processes.start-aodp=true
albion.local.processes.nats-binary=runtime/nats/nats-server.exe
albion.local.processes.aodp-binary=runtime/aodp/albiondata-client-local.exe
albion.local.processes.nats-config=runtime/nats/nats-server.conf
albion.local.processes.log-dir=data/logs
albion.local.processes.nats-port=4222
albion.local.processes.aodp-private-ingest=
albion.local.processes.startup-timeout-seconds=20
albion.local.processes.aodp-listen-devices=


# ===== END ALBIONSERVANT LOCAL MARKET INTEGRATION =====
